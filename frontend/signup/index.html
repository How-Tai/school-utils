<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign Up - School Utils</title>
	<link rel="stylesheet" href="/signup/style.css">
</head>
<body>
	<a class="back-button" href="/">← Back</a>

	<main class="card">
		<h1>Sign Up</h1>
		<form id="signup-form">
			<label for="display-name">Display name</label>
			<input id="display-name" maxlength="40" required>

			<label for="username">Username</label>
			<input id="username" minlength="3" maxlength="24" autocomplete="username" required>

			<label for="password">Password</label>
			<input id="password" type="password" autocomplete="new-password" required>

			<button type="submit">Create account</button>
		</form>
		<p class="switch-page">Already have an account? <a href="/login">Login</a></p>
		<p id="message" hidden></p>
	</main>

	<script src="/signup/script.js"></script>
</body>
</html>
